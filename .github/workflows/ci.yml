name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-sandbox-taskapp:ci .

      - name: Run PHPUnit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app:/var/www/html \
            devops-sandbox-taskapp:ci \
            php bin/phpunit
