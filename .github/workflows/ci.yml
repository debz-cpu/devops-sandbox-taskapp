name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-sandbox-taskapp:ci .

      - name: Install Composer dependencies
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app:/var/www/html \
            devops-sandbox-taskapp:ci \
            composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app:/var/www/html \
            devops-sandbox-taskapp:ci \
            php bin/phpunit

      - name: Check code style (PHP-CS-Fixer)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app:/var/www/html \
            devops-sandbox-taskapp:ci \
            vendor/bin/php-cs-fixer fix --dry-run --diff