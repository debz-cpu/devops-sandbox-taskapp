name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t devops-sandbox-taskapp:ci .

      - name: Run PHPUnit tests
        run: docker run --rm devops-sandbox-taskapp:ci php bin/phpunit

      - name: Check code style (PHP-CS-Fixer)
        run: docker run --rm devops-sandbox-taskapp:ci vendor/bin/php-cs-fixer fix --dry-run --diff
